<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar publicacion | Ragedit</title>
  <meta name="description" content="Ragedit: tienda de videojuegos con foros de la comunidad.">
  <link rel="stylesheet" href="../styles/fuentes.css">
  <link rel="stylesheet" href="../styles/estilos.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="icon" href="../img/Logo.ico" type="image/x-icon">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado-interno">
      <a class="logo" href="index.html" aria-label="Ragedit, ir al inicio"><img src="../img/logo pagina.png" alt="logopagina"></a>

      <form class="caja-busqueda" id="formulario-buscador" role="search">
        <label class="solo-lector" for="buscador">Buscar</label>
        <input id="buscador" type="search" placeholder="Buscar.." autocomplete="off">
        <button class="boton-busqueda" type="submit" aria-label="Buscar"><span class="icono icono-buscar" aria-hidden="true"></span></button>
      </form>

      <nav class="navegacion" aria-label="Principal">
        <div class="menu">
          <button class="menu-boton" type="button" aria-haspopup="true">
            <span class="triangulo triangulo-abajo" aria-hidden="true"></span><span>FOROS</span>
          </button>
          <ul class="menu-lista">
            <li><a href="index.html">Tienda</a></li>
            <li><a href="foros.html">Foros</a></li>
            <li><a href="carrito.html"><span>Carrito</span><span class="globito contador-carrito"></span></a></li>
          </ul>
        </div>
      </nav>

      <div class="zona-usuario menu">
        <button class="menu-boton" type="button" aria-haspopup="true" aria-label="Menu de usuario">
          <span class="triangulo triangulo-abajo" aria-hidden="true"></span><span class="avatar" id="avatar">?</span>
        </button>
        <ul class="menu-lista menu-lista-derecha" id="menu-usuario"></ul>
      </div>
    </div>
  </header>

  <main class="principal">
    <form class="editor editor-edicion" id="formulario-publicacion" novalidate>
      <div class="editor-barra">
        <h1 class="editor-barra-titulo">EDITAR UNA PUBLICACION</h1>
        <a class="boton boton-chico" href="gestionar-publicaciones.html">VOLVER</a>
      </div>

      <div class="editor-cuerpo">
        <div class="editor-campos">
          <label class="solo-lector" for="titulo">Titulo</label>
          <input class="editor-titulo" id="titulo" type="text" maxlength="100" placeholder="Titulo..." autocomplete="off">
          <label class="solo-lector" for="subtitulo">Subtitulo</label>
          <input class="editor-subtitulo" id="subtitulo" type="text" maxlength="120" placeholder="Subtitulo.." autocomplete="off">
          <label class="solo-lector" for="contenido">Contenido</label>
          <textarea class="editor-texto" id="contenido" maxlength="5000" placeholder="De que tema queres hablar?"></textarea>
        </div>
        <label class="editor-imagen" title="Agregar una imagen">
          <span class="solo-lector">Agregar una imagen</span>
          <img id="imagen-vista" alt="Imagen de la publicacion" hidden>
          <svg class="editor-imagen-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <input id="imagen-archivo" type="file" accept="image/*">
        </label>
      </div>

      <div class="editor-pie">
        <div class="editor-pie-fila">
          <p class="estado" id="mensaje" role="status" hidden></p>
          <label class="solo-lector" for="juego">Juego</label>
          <select class="desplegable desplegable-juego" id="juego">
            <option value="">Selecciona un juego</option>
          </select>
        </div>
        <button class="boton boton-publicar" id="boton-guardar" type="submit">REPUBLICAR</button>
      </div>
    </form>
  </main>

  <footer class="pie">
    <p><img src="../img/logo pagina.png" alt=""></p>
    <a href="acerca-de-nosotros.html">Acerca de nosotros</a>
    <a href="ayuda.html">Ayuda</a>
  </footer>

  <button class="back-to-top" id="back-to-top" type="button" aria-label="Volver arriba" title="Volver arriba">▲</button>
  <script src="../script/comun/utiles.js"></script>
  <script src="../script/comun/datos.js"></script>
  <script src="../script/comun/sesion.js"></script>
  <script src="../script/comun/header.js"></script>
  <script src="../script/comun/cookies.js"></script>
  <script src="../script/comun/BackToTop.js"></script>
  <script src="../script/comun/imagen.js"></script>
  <script src="../script/paginas/editar.js"></script>
</body>
</html>
