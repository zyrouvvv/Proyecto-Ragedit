<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carrito | Ragedit</title>
    <meta
      name="description"
      content="Ragedit: tienda de videojuegos con foros de la comunidad."
    />
    <link rel="stylesheet" href="../styles/fuentes.css" />
    <link rel="stylesheet" href="../styles/estilos.css" />
    <link rel="stylesheet" href="../styles/responsive.css" />
    <link rel="icon" href="../img/Logo.ico" type="image/x-icon" />

  </head>
  <body>
    <header class="encabezado">
      <div class="encabezado-interno">
      <a class="logo" href="index.html" aria-label="Ragedit, ir al inicio"><img src="../img/logo pagina.png" alt="logopagina"></a>

        <form class="caja-busqueda" id="formulario-buscador" role="search">
          <label class="solo-lector" for="buscador">Buscar</label>
          <input
            id="buscador"
            type="search"
            placeholder="Buscar.."
            autocomplete="off"
          />
          <button class="boton-busqueda" type="submit" aria-label="Buscar"><span class="icono icono-buscar" aria-hidden="true"></span></button>
        </form>

        <nav class="navegacion" aria-label="Principal">
          <div class="menu">
            <button class="menu-boton" type="button" aria-haspopup="true">
              <span class="triangulo triangulo-abajo" aria-hidden="true"></span
              ><span>FOROS</span>
            </button>
            <ul class="menu-lista">
              <li><a href="index.html">Tienda</a></li>
              <li><a href="foros.html">Foros</a></li>
              <li>
                <a href="carrito.html"
                  ><span>Carrito</span
                  ><span class="globito contador-carrito"></span
                ></a>
              </li>
            </ul>
          </div>
        </nav>

        <div class="zona-usuario menu">
          <button
            class="menu-boton"
            type="button"
            aria-haspopup="true"
            aria-label="Menu de usuario"
          >
            <span class="triangulo triangulo-abajo" aria-hidden="true"></span
            ><span class="avatar" id="avatar">?</span>
          </button>
          <ul class="menu-lista menu-lista-derecha" id="menu-usuario"></ul>
        </div>
      </div>
    </header>

    <main class="principal">
      <div class="carrito">
        <section class="panel" aria-labelledby="titulo-carrito">
          <div class="carrito-barra">
            <h1 class="editor-barra-titulo" id="titulo-carrito">
              CARRITO DE COMPRAS
            </h1>
            <a class="boton boton-chico" href="index.html">SEGUIR COMPRANDO</a>
          </div>
          <div class="carrito-lista">
            <p class="estado" id="mensaje-carrito" role="status" hidden></p>
            <div id="lista-carrito"></div>
          </div>
        </section>

        <aside class="panel resumen" aria-labelledby="titulo-resumen">
          <h2 class="lateral-titulo" id="titulo-resumen">RESUMEN</h2>
          <div class="resumen-linea">
            <span>Productos</span><span id="resumen-cantidad">0</span>
          </div>
          <div class="resumen-linea">
            <span>Subtotal</span><span id="resumen-subtotal">US$ 0,00</span>
          </div>
          <div class="resumen-linea resumen-linea-total">
            <span>Total</span><span id="resumen-total">US$ 0,00</span>
          </div>
          <button class="boton boton-verde" id="boton-comprar" type="button">
            FINALIZAR COMPRA
          </button>
          <button class="boton boton-peligro" id="boton-vaciar" type="button">
            VACIAR CARRITO
          </button>
        </aside>
      </div>
    </main>

    <footer class="pie">
      <p><img src="../img/logo pagina.png" alt="" /></p>
      <a href="acerca-de-nosotros.html">Acerca de nosotros</a>
      <a href="ayuda.html">Ayuda</a>
    </footer>


    <button class="back-to-top" id="back-to-top" type="button" aria-label="Volver arriba" title="Volver arriba">▲</button>
    <script src="../script/comun/utiles.js"></script>
    <script src="../script/comun/datos.js"></script>
    <script src="../script/comun/sesion.js"></script>
    <script src="../script/comun/header.js"></script>
    <script src="../script/comun/cookies.js"></script>
    <script src="../script/comun/BackToTop.js"></script>
    <script src="../script/paginas/carrito.js"></script>
  </body>
</html>
