<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publicacion | Ragedit</title>
  <meta name="description" content="Ragedit: tienda de videojuegos con foros de la comunidad.">
  <link rel="stylesheet" href="../styles/fuentes.css">
  <link rel="stylesheet" href="../styles/estilos.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="icon" href="../img/Logo.ico" type="image/x-icon">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado-interno">
      <a class="logo" href="index.html" aria-label="Ragedit, ir al inicio"><img src="../img/logo pagina.png" alt="logopagina"></a>

      <form class="caja-busqueda" id="formulario-buscador" role="search">
        <label class="solo-lector" for="buscador">Buscar</label>
        <input id="buscador" type="search" placeholder="Buscar.." autocomplete="off">
        <button class="boton-busqueda" type="submit" aria-label="Buscar"><span class="icono icono-buscar" aria-hidden="true"></span></button>
      </form>

      <nav class="navegacion" aria-label="Principal">
        <div class="menu">
          <button class="menu-boton" type="button" aria-haspopup="true">
            <span class="triangulo triangulo-abajo" aria-hidden="true"></span><span>FOROS</span>
          </button>
          <ul class="menu-lista">
            <li><a href="index.html">Tienda</a></li>
            <li><a href="foros.html">Foros</a></li>
            <li><a href="carrito.html"><span>Carrito</span><span class="globito contador-carrito"></span></a></li>
          </ul>
        </div>
      </nav>

      <div class="zona-usuario menu">
        <button class="menu-boton" type="button" aria-haspopup="true" aria-label="Menu de usuario">
          <span class="triangulo triangulo-abajo" aria-hidden="true"></span><span class="avatar" id="avatar">?</span>
        </button>
        <ul class="menu-lista menu-lista-derecha" id="menu-usuario"></ul>
      </div>
    </div>
  </header>

  <main class="principal">
    <article class="publi panel" id="publicacion">
      <div class="publi-barra">
        <a class="boton boton-chico" href="foros.html">VOLVER</a>
        <button class="boton boton-reportar" id="boton-reportar-publicacion" type="button" hidden>REPORTAR</button>
      </div>

      <div class="publi-principal">
        <header class="publi-cabecera">
          <h1 class="publi-titulo" id="publi-titulo"></h1>
          <time class="publi-tiempo" id="publi-tiempo"></time>
        </header>
        <h2 class="publi-subtitulo" id="publi-subtitulo" hidden></h2>
        <p class="publi-autor" id="publi-autor"></p>
        <p class="publi-texto" id="publi-texto"></p>
        <img class="publi-imagen" id="publi-imagen" alt="Imagen de la publicacion" hidden>
      </div>

      <section class="publi-comentarios" id="caja-comentarios" aria-label="Comentarios" hidden>
        <ul class="hilo" id="lista-comentarios"></ul>
      </section>

      <form class="publi-acciones" id="formulario-comentario">
        <label class="solo-lector" for="texto-comentario">Comentar</label>
        <input class="entrada-comentario" id="texto-comentario" type="text" maxlength="300" placeholder="Comentar..." autocomplete="off">
        <button class="enviar-comentario" type="submit">ENVIAR</button>
        <div class="votos">
          <span class="voto voto-me-gusta"><output id="cantidad-me-gusta">0</output><button id="voto-arriba" type="button" aria-label="Me gusta" aria-pressed="false"><span class="icono icono-like"></span></button></span>
          <span class="voto voto-no-me-gusta"><output id="cantidad-no-me-gusta">0</output><button id="voto-abajo" type="button" aria-label="No me gusta" aria-pressed="false"><span class="icono icono-dislike"></span></button></span>
          <span class="voto voto-reposteo"><button id="voto-repost" type="button" aria-label="Repostear" aria-pressed="false"><span class="icono icono-repost"></span></button></span>
        </div>
      </form>
    </article>
  </main>

  <footer class="pie">
    <p><img src="../img/logo pagina.png" alt=""></p>
    <a href="acerca-de-nosotros.html">Acerca de nosotros</a>
    <a href="ayuda.html">Ayuda</a>
  </footer>

  <button class="back-to-top" id="back-to-top" type="button" aria-label="Volver arriba" title="Volver arriba">▲</button>
  <script src="../script/comun/utiles.js"></script>
  <script src="../script/comun/datos.js"></script>
  <script src="../script/comun/sesion.js"></script>
  <script src="../script/comun/header.js"></script>
  <script src="../script/comun/BackToTop.js"></script>
  <script src="../script/comun/publicaciones.js"></script>
  <script src="../script/paginas/publicacion.js"></script>
  <script src="../script/comun/reportes.js"></script>
</body>
</html>
