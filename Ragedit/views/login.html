<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicia sesion | Ragedit</title>
  <meta name="description" content="Ragedit: tienda de videojuegos con foros de la comunidad.">
  <link rel="stylesheet" href="../styles/fuentes.css">
  <link rel="stylesheet" href="../styles/estilos.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="icon" href="../img/Logo.ico" type="image/x-icon">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado-interno">
      <a class="logo" href="index.html" aria-label="Ragedit, ir al inicio"><img src="../img/logo pagina.png" alt="logopagina"></a>

      <form class="caja-busqueda" id="formulario-buscador" role="search">
        <label class="solo-lector" for="buscador">Buscar</label>
        <input id="buscador" type="search" placeholder="Buscar.." autocomplete="off">
        <button class="boton-busqueda" type="submit" aria-label="Buscar"><span class="icono icono-buscar" aria-hidden="true"></span></button>
      </form>

      <nav class="navegacion navegacion-alerta" aria-label="Principal">
        <div class="menu">
          <button class="menu-boton" type="button" aria-haspopup="true">
            <span class="triangulo triangulo-abajo" aria-hidden="true"></span><span>FOROS</span>
          </button>
          <ul class="menu-lista">
            <li><a href="index.html">Tienda</a></li>
            <li><a href="foros.html">Foros</a></li>
            <li><a href="carrito.html"><span>Carrito</span><span class="globito contador-carrito"></span></a></li>
          </ul>
        </div>
      </nav>

      <div class="zona-usuario menu">
        <button class="menu-boton" type="button" aria-haspopup="true" aria-label="Menu de usuario">
          <span class="triangulo triangulo-abajo" aria-hidden="true"></span><span class="avatar" id="avatar">?</span>
        </button>
        <ul class="menu-lista menu-lista-derecha" id="menu-usuario"></ul>
      </div>
    </div>
  </header>

  <main class="principal">
    <section class="acceso" aria-labelledby="titulo-pagina">
      <h1 class="acceso-titulo" id="titulo-pagina">INICIA SESION</h1>
      <p class="estado" id="mensaje" role="status" hidden></p>

      <form id="formulario-login" novalidate>
        <div class="campo">
          <label class="campo-etiqueta" for="identidad">Nombre de usuario o Correo</label>
          <input class="campo-entrada" id="identidad" type="text" autocomplete="username">
        </div>

        <div class="campo">
          <label class="campo-etiqueta" for="clave">Contraseña</label>
          <input class="campo-entrada" id="clave" type="password" autocomplete="current-password">
        </div>

        <div class="acceso-rapido">
          <p class="campo-etiqueta">O Inicia sesion mas rapido con:</p>
          <div class="acceso-rapido-lista">
            <button class="rapido" type="button" data-servicio="google">Google</button>
            <button class="rapido" type="button" data-servicio="discord">Discord</button>
            <button class="rapido" type="button" data-servicio="steam">Steam</button>
          </div>
        </div>

        <button class="boton boton-enviar" type="submit">INICIAR SESION</button>
      </form>

      <div class="acceso-cambio">
        <span>¿No recuerdas tu contraseña?</span>
        <a class="enlace" id="enlace-recuperar" href="#">RECUPERALA</a>
      </div>
      <div class="acceso-cambio">
        <span>¿No tienes una cuenta creada?</span>
        <a class="ir" href="registro.html">REGISTRATE <span class="triangulo triangulo-abajo" aria-hidden="true"></span></a>
      </div>
    </section>
  </main>

  <footer class="pie">
    <p><img src="../img/logo pagina.png" alt=""></p>
    <a href="acerca-de-nosotros.html">Acerca de nosotros</a>
    <a href="ayuda.html">Ayuda</a>
  </footer>

  <button class="back-to-top" id="back-to-top" type="button" aria-label="Volver arriba" title="Volver arriba">▲</button>
  <script src="../script/comun/utiles.js"></script>
  <script src="../script/comun/datos.js"></script>
  <script src="../script/comun/sesion.js"></script>
  <script src="../script/comun/header.js"></script>
  <script src="../script/comun/cookies.js"></script>
  <script src="../script/comun/BackToTop.js"></script>
  <script src="../script/paginas/login.js"></script>
</body>
</html>
